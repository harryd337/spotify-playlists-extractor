[project]
name = "spotify-playlists-extractor"
version = "0.1.1"
description = "A python tool that uses the Spotify API to automatically extract and backup all metadata from your Spotify playlists."
authors = [
    { name = "Harry Durnberger", email = "100152207+harryd337@users.noreply.github.com" }
]
readme = "README.md"
packages = [
    { include = "spotify_playlists_extractor", from = "src" },
]
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "pandas>=2.3.1",
    "pydantic-settings>=2.10.1",
    "toml>=0.10.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "spotipy>=2.25.1",
]

[project.scripts]
spotify-playlists-extractor = "spotify_playlists_extractor.core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0,<5",
    "pylint>=3.3.7,<5",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.14.3,<1",
    "types-markdown>=3.10.0.20251106,<4",
    "pytest-xdist>=3.8.0,<4",
    "commitizen>=4.16.4,<5",
]
docs = [
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autobuild>=2024.10.3",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
# Add list of modules to ignore
module = ["yaml"]
ignore_missing_imports = true


[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "D",  # pydocstyle
    "I",  # isort
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade
]

# Ruff docs recommend against using these alongside the Ruff formatter (cause conflicts)
# https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pylint.MASTER]
extension-pkg-whitelist="pydantic"
# pylint note: use pylint-django for Django projects

[tool.pylint.FORMAT]
max-line-length = "88"
output-format="colorized"
score="no"

[tool.pylint.REPORTS]
output-format="colorized"
score="no"

[tool.pylint.'MESSAGES CONTROL']
disable=[
  "C0116",
  "C0114",
  "C0115",
  "C0103",
  "R0801",
  "R0903",
  "R0912",
  "R0913",
  "R1702",
  "R1705",  # no-else-return: style preference
  "W0718",
  "W1203",  # logging-fstring-interpolation: f-strings are fine in modern Python
  "W0621",  # redefined-outer-name: normal in pytest fixtures
  "W0613",  # unused-argument: common in pytest fixtures
  "W0404",  # reimported: intentional for avoiding circular imports
  "C0302",  # too-many-lines: common for test files
  "C0415",  # import-outside-toplevel: intentional Django/Celery patterns
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.uv]
exclude-newer = "1 week"
