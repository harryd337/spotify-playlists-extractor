name: Bump version

on:
    push:
        branches:
            - dev

concurrency:
    group: bump-${{ github.ref_name }}

jobs:
    bump-version:
        if: "${{ !startsWith(github.event.head_commit.message, 'bump:') }}"
        runs-on: ubuntu-latest
        name: 'Bump version and create changelog with commitizen'
        permissions:
            contents: write
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
                  fetch-depth: 0
                  fetch-tags: true
            - uses: commitizen-tools/setup-cz@96c75e6ae9632047f2c9b4025b9dd1624b40de8f # v0.9.1
              with:
                  version: 4.16.4
            - id: bump-version
              run: |
                  old_sha="$(git rev-parse HEAD)"
                  cz --no-raise 21 bump --yes

                  if [ "$(git rev-parse HEAD)" = "$old_sha" ]; then
                    echo "No bump-eligible commits found, skipping release."
                    echo "bumped=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "bumped=true" >> "$GITHUB_OUTPUT"
                  new_version="$(cz version -p)"
                  echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
                  new_version_tag="$(cz version -p --tag)"
                  echo "new_version_tag=$new_version_tag" >> "$GITHUB_OUTPUT"
                  git push origin HEAD
                  git push origin "refs/tags/${new_version_tag}"
            - name: Build changelog
              if: "${{ steps.bump-version.outputs.bumped == 'true' }}"
              env:
                  NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
              run: |
                  cz changelog --dry-run "${NEW_VERSION}" > .changelog.md
            - name: Release
              if: "${{ steps.bump-version.outputs.bumped == 'true' }}"
              env:
                  GH_TOKEN: ${{ github.token }}
                  NEW_VERSION_TAG: ${{ steps.bump-version.outputs.new_version_tag }}
              run: |
                  gh release create "${NEW_VERSION_TAG}" --notes-file .changelog.md --target "${{ github.ref_name }}"
