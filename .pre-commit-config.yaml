default_install_hook_types:
    - pre-commit
    - post-checkout
    - post-merge
    - post-rewrite
    - commit-msg
    - pre-push
repos:
    # Ruff linting and formatting
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.5
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    # Mypy type checking
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.4.1
      hooks:
          - id: mypy
            language: python
            additional_dependencies:
                - types-toml==0.10.8.20260518
                - types-Markdown==3.11.3.20261108

    # Pre-commit hooks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            exclude: ^docker-compose.*\.ya?ml$
          - id: check-toml
          - id: check-json
            exclude: ^\.zed/
          - id: check-added-large-files
          - id: check-merge-conflict
          - id: debug-statements
          - id: check-docstring-first

    # Gitleaks secret detection
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks

    # Bandit security linting
    - repo: https://github.com/PyCQA/bandit
      rev: 1.9.4
      hooks:
          - id: bandit
            args: ['-c', 'pyproject.toml']

    # uv hooks for dependency management
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.13.9
      hooks:
          - id: uv-lock
          - id: uv-sync

    # lint-staged for JavaScript (runs Prettier + ESLint)
    - repo: local
      hooks:
          - id: git-lfs-pre-push
            name: git lfs pre-push
            entry: bash -c 'git lfs pre-push "${PRE_COMMIT_REMOTE_NAME:?}" "${PRE_COMMIT_REMOTE_URL:?}"'
            language: system
            pass_filenames: false
            always_run: true
            stages:
                - pre-push

    # Commitizen for commit standardisation
    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.19.3
      hooks:
          - id: commitizen
          - id: commitizen-branch
            stages:
                - pre-push
